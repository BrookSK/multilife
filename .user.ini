; Limites do PHP quando roda como PHP-FPM/CGI (no mod_php valem os do .htaccess).
; Webhook da Evolution: mídia em base64 no corpo da requisição.
; O PHP relê este arquivo a cada 5 min (user_ini.cache_ttl).
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
