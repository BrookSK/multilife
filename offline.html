<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1aa8a8">
<title>Sem conexão · MultiLife Care</title>
<link rel="icon" href="/pwa/favicon-32.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7f9;color:#0f172a;padding:24px;box-sizing:border-box}
  .box{max-width:380px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px 22px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08)}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:22px;margin:16px 0 8px}
  p{color:#475569;line-height:1.55;margin:0 0 18px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#1aa8a8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <img src="/pwa/icon-192.png" alt="MultiLife Care">
    <h1>Sem conexão com a internet</h1>
    <p>O MultiLife Care precisa de internet para mostrar os dados (por segurança, nada de pacientes fica guardado no celular). Assim que a conexão voltar, toque em "Tentar de novo".</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
